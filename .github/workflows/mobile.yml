name: Mobile CI/CD (Expo Android)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: './mobile/package-lock.json'

    - name: Setup Expo Tooling
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        eas-version: latest
        token: ${{ secrets.EXPO_TOKEN }} # Authenticates GitHub with Expo [1]

    - name: Install Dependencies
      run: npm ci

    - name: Trigger EAS Android Build
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        # Generates your Android build profile in the cloud. 
        # Change '--profile preview' to '--profile production' if you want a Play Store AAB bundle.
        eas build --platform android --profile preview --non-interactive
