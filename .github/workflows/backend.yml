name: Backend CI (Python + FastAPI)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**' # Triggers only on backend changes
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend # Automates 'cd backend' for all steps

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9.13' # Change to your exact Python version if needed
        cache: 'pip' # Automatically caches your packages for speed

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8 (Optional)
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run FastAPI Tests
      run: |
        # Assumes you have pytest installed via requirements.txt
        pytest
