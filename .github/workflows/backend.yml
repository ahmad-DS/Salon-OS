name: Backend CI/CD (Python + FastAPI)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9.13' # Change to your exact Python version if needed
        cache: 'pip' # Automatically caches your packages for speed

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run FastAPI Tests
      run: |
        # Only deploy if tests pass. Remove 'pytest' line if you don't have tests yet.
        # pytest 

    - name: Trigger Render Deployment
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
